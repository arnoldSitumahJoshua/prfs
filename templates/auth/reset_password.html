<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — PRFS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

<div class="login-wrap">
  <form method="POST" class="card login-card">
    <h1 class="login-logo">PRFS</h1>
    <p class="login-sub">Set a new password</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <p style="font-size:13px;color:#6B665B;">
      Setting a new password for <strong>{{ user.name }}</strong> ({{ user.username }}).
      Passwords must be at least 10 characters and cannot contain the username.
    </p>

    <label>New password (minimum 10 characters)
      <input type="password" name="new_password" required minlength="10">
    </label>

    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="10">
    </label>

    <button class="btn primary" type="submit">Reset password</button>
  </form>
</div>

</body>
</html>
