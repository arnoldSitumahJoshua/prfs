{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block heading %}Change Password{% endblock %}

{% block content %}

<div class="card" style="max-width:480px;">
  <p style="color:#9B3D2E;font-weight:600;margin-top:0;">
    ⚠ You must set a new password before continuing.
  </p>

  <form method="POST">
    <label>Current password
      <input type="password" name="current_password" required>
    </label>
    <label>New password (minimum 10 characters)
      <input type="password" name="new_password" required minlength="10">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="10">
    </label>
    <button class="btn primary" type="submit">Change password</button>
  </form>
</div>

{% endblock %}
